[package]
name = "core_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
crypto_dedup = { path = "../crypto_dedup" }
database = { path = "../database" }
local_ai = { path = "../local_ai" }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
ssh2 = "0.9"
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf_oxide = "0.3"
docx-lite = "0.2"

[build-dependencies]
tauri-build = { version = "2" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["full"] }