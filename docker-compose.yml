# tfatleek-watcher v2: AI-powered inbox monitor on the Asustor NAS.
#
# Deployment (run from this directory on the NAS):
#   cp .env.example .env   # fill in PAPERLESS_TOKEN and (optionally) GEMINI_API_KEY
#   docker compose up -d
#
# PAPERLESS_TOKEN and GEMINI_API_KEY are read from .env (gitignored).
# All non-sensitive vars are declared inline below.

services:
  tfatleek-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: tfatleek-watcher:v2
    container_name: tfatleek-watcher
    restart: unless-stopped
    volumes:
      - ./watcher.py:/app/watcher.py:ro
      - /share/Papers/Tfatleek_Inbox:/share/Papers/Tfatleek_Inbox
      - /share/Papers/Tfatleek:/share/Papers/Tfatleek
    command: >
      sh -c "echo startup-ok > /share/Papers/Tfatleek/watcher_startup.txt &&
             python -u /app/watcher.py 2>&1 |
             tee -a /share/Papers/Tfatleek/watcher.log"
    environment:
      TFATLEEK_INBOX:       /share/Papers/Tfatleek_Inbox
      TAXONOMY_ROOT:        /share/Papers/Tfatleek
      PAPERLESS_URL:        http://192.168.254.18:25680
      PAPERLESS_TOKEN:      ${PAPERLESS_TOKEN:?PAPERLESS_TOKEN must be set in .env}
      PAPERLESS_INBOX_TAG:  "1"
      OLLAMA_URL:           http://192.168.254.14:11434
      OLLAMA_MODEL:         qwen3:14b
      GEMINI_API_KEY:       ${GEMINI_API_KEY:-}
      CONFIDENCE_THRESHOLD: "0.5"
      SETTLE_POLLS:         "6"
      SETTLE_INTERVAL:      "0.5"
      SNIPPET_CHARS:        "2000"
